name: Validate archive metadata
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m json.tool catalog/catalog.json > /dev/null
      - run: python scripts/check_git_assets.py
      - run: python -m unittest discover -s tests -v
